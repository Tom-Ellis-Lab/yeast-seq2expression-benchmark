# Canonical yeastbench run.
#
# This file is the single source of truth for the numbers we report in
# the paper / README. Change anything here → cut a new config version.
#
# Invocation:
#   uv run ybench run --config configs/default.yaml
#
# Filters:
#   uv run ybench run --config configs/default.yaml --model shorkie
#   uv run ybench run --config configs/default.yaml --task  caudal_eqtl
#
# Dry-run (show what would execute, do nothing):
#   uv run ybench run --config configs/default.yaml --dry-run

out_dir: results/default
device: cuda

tasks_config:
  caudal_eqtl:
    distribution_dir: data/tasks/caudal_eqtl
    fasta_path: data/tasks/R64-1-1.fa
    gtf_path: data/tasks/R64-1-1.115.gtf
  kita_eqtl:
    distribution_dir: data/tasks/kita_eqtl
    fasta_path: data/tasks/R64-1-1.fa
    gtf_path: data/tasks/R64-1-1.115.gtf
  rafi_mpra_marginalized:
    data_dir: data/tasks/rafi_mpra
    fasta_path: data/tasks/R64-1-1.fa
    gtf_path: data/tasks/R64-1-1.115.gtf
  shalem_mpra_marginalized:
    data_path: data/tasks/shalem_mpra_terminator/segal_2015.tsv
    fasta_path: data/tasks/R64-1-1.fa
    gtf_path: data/tasks/R64-1-1.115.gtf
  wu_rfpins:
    cassette_seq: data/tasks/wu_rfpins/expression_cassette.fasta
    labels_path: data/tasks/wu_rfpins/table_s2_fluorescence_1044_loci.csv
    fasta_path: data/tasks/R64-1-1.fa
    gtf_path: data/tasks/R64-1-1.115.gtf
  hong_igr:
    labels_path: data/tasks/hong/hong_igr_v1.tsv
    cassette_seq: data/tasks/hong/expression_cassette.fasta
    fasta_path: data/tasks/R64-5-1.fa
  gui_gfp_rna:
    distribution_dir: data/tasks/gui
    fasta_path: data/tasks/R64-5-1.fa
    bootstrap_samples: 2000
    bootstrap_seed: 57
  chen_synonymous:
    fasta_path: data/tasks/R64-1-1.fa
    hosts_path: data/tasks/chen_synonymous/marginalized_hosts.json
    data_dir: data/tasks/chen_synonymous
    # One task, three libraries; results are stratified per library and an
    # aggregate (mean over the 5 replicate columns) is reported alongside.
    libraries:
      - library: gfp_r1
        data_path: data/tasks/chen_synonymous/gfp_r1.tsv
        replicate_ceiling_pearson: 0.83
        replicate_ceiling_spearman: 0.71
      - library: gfp_r2
        data_path: data/tasks/chen_synonymous/gfp_r2.tsv
        replicate_ceiling_pearson: 0.73
        replicate_ceiling_spearman: 0.71
      - library: tdh3
        data_path: data/tasks/chen_synonymous/tdh3.tsv
        replicate_ceiling_pearson: 0.72
        # No Spearman ceiling for TDH3 — Chen ships only one merged
        # log2(mRNA) column in supp Table S9, so we can't compute one from
        # the data and the paper doesn't report it.
  cuperus_utr:
    random_path: data/tasks/cuperus_mpra_5utr/random_utrs.tsv
    native_path: data/tasks/cuperus_mpra_5utr/native_utrs.tsv
    fasta_path: data/tasks/R64-1-1.fa
  ytk_promoter:
    labels_path: data/tasks/ytk_promoter/figure3a.tsv
    constructs_path: data/tasks/ytk_promoter/constructs.tsv
    constructs_fasta: data/tasks/ytk_promoter/constructs.fasta
    fasta_path: data/tasks/R64-1-1.fa
  brooks_scramble:
    data_path: data/tasks/brooks_scramble
  meneu_foreign_dna:
    data_path: data/tasks/meneu_foreign_dna

runs:
  - model: shorkie
    tasks:
      [
        caudal_eqtl,
        kita_eqtl,
        rafi_mpra_marginalized,
        shalem_mpra_marginalized,
        wu_rfpins,
        hong_igr,
        cuperus_utr,
        ytk_promoter,
      ]
    model_config: &shorkie_config
      params_path: data/models/shorkie/params.json
      checkpoint_paths:
        - data/models/shorkie/checkpoints/f0.h5
        - data/models/shorkie/checkpoints/f1.h5
        - data/models/shorkie/checkpoints/f2.h5
        - data/models/shorkie/checkpoints/f3.h5
        - data/models/shorkie/checkpoints/f4.h5
        - data/models/shorkie/checkpoints/f5.h5
        - data/models/shorkie/checkpoints/f6.h5
        - data/models/shorkie/checkpoints/f7.h5
      batch_size: 32
      use_rc: true

  - model: shorkie_random_init
    tasks:
      [
        caudal_eqtl,
        kita_eqtl,
        rafi_mpra_marginalized,
        shalem_mpra_marginalized,
        wu_rfpins,
        hong_igr,
        cuperus_utr,
        ytk_promoter,
      ]
    model_config: &shorkie_random_init_config
      params_path: data/models/shorkie_random_init/params.json
      checkpoint_paths:
        - data/models/shorkie_random_init/checkpoints/f0.h5
        - data/models/shorkie_random_init/checkpoints/f1.h5
        - data/models/shorkie_random_init/checkpoints/f2.h5
        - data/models/shorkie_random_init/checkpoints/f3.h5
        - data/models/shorkie_random_init/checkpoints/f4.h5
        - data/models/shorkie_random_init/checkpoints/f5.h5
        - data/models/shorkie_random_init/checkpoints/f6.h5
        - data/models/shorkie_random_init/checkpoints/f7.h5
      batch_size: 32
      use_rc: true

  - model: yorzoi
    tasks:
      [
        caudal_eqtl,
        kita_eqtl,
        rafi_mpra_marginalized,
        shalem_mpra_marginalized,
        wu_rfpins,
        hong_igr,
        chen_synonymous,
        cuperus_utr,
        ytk_promoter,
      ]
    model_config: &yorzoi_config
      hf_repo: tom-ellis-lab/yorzoi
      batch_size: 64
      use_rc: true

  # Gui uses the shared model settings with smaller inference batches.
  - model: shorkie
    tasks: [gui_gfp_rna]
    model_config:
      <<: *shorkie_config
      batch_size: 8

  - model: shorkie_random_init
    tasks: [gui_gfp_rna]
    model_config:
      <<: *shorkie_random_init_config
      batch_size: 8

  - model: yorzoi
    tasks: [gui_gfp_rna]
    model_config:
      <<: *yorzoi_config
      hf_revision: cba61e046a75e0b302e946aaf27f88a73824a8a9
      batch_size: 16

  - model: exoshorkie_ensemble
    tasks: [gui_gfp_rna]
    model_config:
      checkpoint_dir: data/models/exoshorkie
      batch_size: 8
      autocast: false

  # Chen batches variants, each expanded over all host contexts.
  - model: shorkie
    tasks: [chen_synonymous]
    model_config:
      <<: *shorkie_config
      batch_size: 4

  - model: shorkie_random_init
    tasks: [chen_synonymous]
    model_config:
      <<: *shorkie_random_init_config
      batch_size: 4

  # Coverage tasks use the same weights with smaller batches, matching
  # the adapter defaults used by configs/brooks.yaml and configs/meneu.yaml.
  - model: shorkie
    tasks: [brooks_scramble, meneu_foreign_dna]
    model_config:
      <<: *shorkie_config
      batch_size: 4

  - model: shorkie_random_init
    tasks: [brooks_scramble, meneu_foreign_dna]
    model_config:
      <<: *shorkie_random_init_config
      batch_size: 4

  - model: yorzoi
    tasks: [brooks_scramble]
    model_config:
      <<: *yorzoi_config
      batch_size: 16
      track_mode: matched

  - model: yorzoi
    tasks: [meneu_foreign_dna]
    model_config:
      <<: *yorzoi_config
      batch_size: 16
      track_mode: illumina_exo

  - model: cai
    tasks: [chen_synonymous]
    model_config: {}

  - model: codon_transformer
    tasks: [chen_synonymous]
    model_config: {}

  # Supervised in-distribution reference baseline (reported separately from
  # the zero-shot foundation models). Single DREAM-RNN net trained on this
  # very assay; scored on the insert in its own reporter context, not
  # marginalized at native loci. See docs/benchmarks/rafi_mpra_promoter.md.
  - model: dream_rnn
    tasks: [rafi_mpra_marginalized]
    model_config:
      weights_path: data/models/dream_rnn/model_best.pth
      plasmid_path: data/models/dream_rnn/plasmid.json
      batch_size: 1024
